name: Render video

on:
  workflow_dispatch:
    inputs:
      spot:
        description: 'Nama spot (judul video)'
        default: 'Kolong flyover'
      handle:
        description: 'Nama akun'
        default: '@namaakun'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pasang paket
        run: npm install
      - name: Render video
        run: node render.js
        env:
          SPOT: ${{ inputs.spot }}
          HANDLE: ${{ inputs.handle }}
      - name: Simpan hasil
        uses: actions/upload-artifact@v4
        with:
          name: skatepark-video
          path: out/skatepark.mp4
          if-no-files-found: error
